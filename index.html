<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galería ligera y responsiva con animaciones suaves y navegación accesible.">
  <meta name="theme-color" content="#07080f">
  <title>Galería de Alta Velocidad</title>
  <link rel="preconnect" href="https://i.ibb.co" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">

    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Galería avanzada</p>
        <h1>Visualiza tu colección<br>con velocidad y estilo</h1>
        <p class="subtitle">Carga diferida inteligente, transiciones fluidas y controles accesibles para una experiencia premium.</p>
      </div>
    </header>

    <main class="gallery-container">
      <section class="gallery" id="gallery" aria-labelledby="gallery-title">
        <h2 id="gallery-title" class="sr-only">Galería de imágenes</h2>
      </section>
    </main>

    <div id="image-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-counter">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-panel">
        <div class="modal-toolbar">
          <button class="modal-nav" data-direction="prev" type="button" aria-label="Imagen anterior">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="modal-counter" id="modal-counter" aria-live="polite">1 / 15</span>
          <button class="modal-nav" data-direction="next" type="button" aria-label="Imagen siguiente">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="modal-close" type="button" aria-label="Cerrar vista ampliada">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <figure>
          <img id="modal-img" class="modal-content" alt="">
          <figcaption id="caption" class="modal-caption"></figcaption>
        </figure>
        <div class="modal-strip-wrap">
          <div class="modal-strip" id="modal-strip" role="list" aria-label="Miniaturas de la galería"></div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <span>Navega con <kbd class="kbd">←</kbd> <kbd class="kbd">→</kbd> · Desliza en móvil · <kbd class="kbd">Esc</kbd> para cerrar</span>
    </footer>

  </div>
  <script src="script.js" defer></script>
</body>
</html>
